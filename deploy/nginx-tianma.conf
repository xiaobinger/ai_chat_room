# 天马行空 —— nginx 反代配置（裸机部署）
#
# 功能：
#   1. 把 /api/* 与 /health 反代到本地 API（:4000）
#   2. 把 WebSocket 端点（/api/v1/rooms/:id/ws）透传
#   3. 把静态前端（apps/web/dist）作为 SPA 托管在根路径 /
#
# 用法：
#   sudo cp nginx-tianma.conf /etc/nginx/sites-available/tianma
#   sudo ln -s /etc/nginx/sites-available/tianma /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 安全建议：
#   - 生产应加在 server 块里加 SSL（Let's Encrypt）
#   - 限制 client_max_body_size 防止大 payload 攻击
#   - 可加 rate limiting（limit_req_zone）到 /api 前缀

upstream tianma_api {
  server 127.0.0.1:4000;
  # 多实例时加更多 server 行，nginx 默认轮询
  keepalive 16;
}

server {
  listen 80;
  server_name _;  # 替换为实际域名，如 chat.example.com

  client_max_body_size 1m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # 健康检查（应用根，不在 /api 下）
  location = /health {
    proxy_pass http://tianma_api;
  }

  # API + WebSocket（同一条规则覆盖 HTTP 与 WS）
  location /api/ {
    proxy_pass http://tianma_api;

    # WebSocket 透传三件套，缺一不可
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA 静态资源
  root /opt/tianma/apps/web/dist;
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源长期缓存（文件名带 hash）
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
